<section class="panel token-panel"><div class="section-heading"><div><span class="section-index">05</span><div><h2>API Token 统计</h2><p>按接口、调用密钥、模型和网关实例查看请求用量。</p></div></div></div><div class="token-filters"><label>实例<select id="tokenInstance"><option value="">全部实例</option></select></label><label>接口<select id="tokenPath"><option value="">全部接口</option></select></label><label>模型<select id="tokenModel"><option value="">全部模型</option></select></label><label>调用密钥<select id="tokenKey"><option value="">全部密钥</option></select></label><label>状态<select id="tokenStatus"><option value="">全部状态</option><option value="200">成功 200</option><option value="429">上游 429</option><option value="502">网关 502</option></select></label><button id="tokenFilterApply" class="button button-quiet" type="button">筛选</button></div><div id="tokenSummary" class="token-summary"><div class="token-stat"><span>请求总数</span><strong id="tokenRequests">-</strong><small id="tokenSuccess">成功 -</small></div><div class="token-stat"><span>总 Tokens</span><strong id="tokenTotal">-</strong><small>返回响应累计</small></div><div class="token-stat" data-token-detail><span>输入 Tokens</span><strong id="tokenPrompt">-</strong><small>Prompt tokens</small></div><div class="token-stat" data-token-detail><span>输出 Tokens</span><strong id="tokenCompletion">-</strong><small>Completion tokens</small></div><div class="token-stat"><span>命中缓存</span><strong id="tokenCached">-</strong><small>Cached tokens</small></div><div class="token-stat"><span>缓存命中率</span><strong id="tokenCacheRate">-</strong><small>缓存 / 输入 Tokens</small></div><div class="token-stat token-cost-stat"><span>费用估算</span><strong id="tokenCost">-</strong><small>USD · 按模型费率</small></div></div><div class="table-wrap token-table-wrap"><table class="token-table"><thead><tr><th>时间</th><th>实例 / 出口</th><th>接口</th><th>调用密钥</th><th>模型</th><th>流</th><th>Tokens</th><th>费用</th><th>状态</th><th>耗时</th></tr></thead><tbody id="tokenRows"></tbody></table></div></section>
